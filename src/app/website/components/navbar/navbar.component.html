<!-- Sticky navbar: transparent on hero, white+shadow on scroll -->
<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" [ngClass]="(isScrolled || !isHomePage)
    ? 'bg-white/95 backdrop-blur-md shadow-md border-b border-gray-100'
    : 'bg-transparent'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between py-2">

      <!-- Logo (Left) -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="flex items-center group px-4 py-1.5 rounded-2xl transition-all duration-300"
          [ngClass]="(isScrolled || !isHomePage) ? '' : 'bg-white/95 backdrop-blur-md shadow-lg border border-white/40 hover:bg-white'">
          <img class="h-9 w-auto object-contain transition-transform duration-300 group-hover:scale-105"
            src="/assets/logo.png" alt="Garage Mandi Logo" />
        </a>
      </div>

      <!-- Desktop Nav Links (Right) -->
      <div class="hidden md:flex items-center gap-1">
        <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="font-bold"
          [ngClass]="(isScrolled || !isHomePage) ? 'text-gray-700 hover:text-[#db3333]' : 'text-white/90 hover:text-white'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/10">Home</a>

        <a routerLink="/about" routerLinkActive="font-bold"
          [ngClass]="(isScrolled || !isHomePage) ? 'text-gray-700 hover:text-[#db3333]' : 'text-white/90 hover:text-white'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/10">About</a>

        <a routerLink="/contact" routerLinkActive="font-bold"
          [ngClass]="(isScrolled || !isHomePage) ? 'text-gray-700 hover:text-[#db3333]' : 'text-white/90 hover:text-white'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/10">Contact</a>

        <!-- Book Now Button (Only visible to customers) -->
        <a *ngIf="isLoggedIn && userRoleSlug !== 'service-provider'" routerLink="/request-quote"
          class="ml-2 px-4 py-2 rounded-lg text-sm font-bold text-white bg-[#db3333] hover:bg-[#c22b2b] transition-all duration-200 shadow-md hover:shadow-lg">
          Request
        </a>

        <!-- Login Button (Visible if not logged in) -->
        <a *ngIf="!isLoggedIn" routerLink="/customer-login"
          class="ml-2 px-4 py-2 rounded-lg text-sm font-bold text-white bg-[#db3333] hover:bg-[#c22b2b] transition-all duration-200 shadow-md hover:shadow-lg">
          Login
        </a>

        <!-- Profile Dropdown (Visible if logged in) -->
        <div class="relative ml-2" *ngIf="isLoggedIn" (mouseenter)="isProfileMenuOpen = true"
          (mouseleave)="isProfileMenuOpen = false">
          <button
            class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 border-2 border-transparent hover:border-[#db3333] transition-all duration-200 focus:outline-none">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isProfileMenuOpen" class="absolute right-0 top-full pt-1 w-48 z-50">
            <div class="bg-white rounded-lg shadow-xl py-2 border border-gray-100">
              <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/customer-profile"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#db3333]">Profile</a>
              <a *ngIf="userRoleSlug === 'service-provider'" routerLink="/provider-profile"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#db3333]">Profile</a>
             <a *ngIf="userRoleSlug === 'service-provider'" routerLink="/workshop-operations"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#db3333]">Workshop Operations</a>
              <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/recent-activity"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#db3333]">Recent Activity</a>
              <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/my-requests"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#db3333]">My Requests</a>
              <div class="border-t border-gray-100 my-1"></div>
              <button (click)="logout()"
                class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Hamburger -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" class="p-2 rounded-lg transition-all focus:outline-none"
          [ngClass]="(isScrolled || !isHomePage) ? 'text-gray-700 hover:bg-gray-100' : 'text-white hover:bg-white/10'">
          <svg class="h-6 w-6" [ngClass]="{ hidden: isMobileMenuOpen, block: !isMobileMenuOpen }" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg class="h-6 w-6" [ngClass]="{ block: isMobileMenuOpen, hidden: !isMobileMenuOpen }" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div [ngClass]="{ block: isMobileMenuOpen, hidden: !isMobileMenuOpen }"
    class="md:hidden bg-white/95 backdrop-blur-xl border-t border-gray-100 shadow-xl absolute w-full left-0">
    <div class="px-4 pt-4 pb-6 space-y-1 max-w-7xl mx-auto">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-blue-50 text-[#131e3d] font-semibold border-l-4 border-[#db3333]"
        class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Home</a>

      <a routerLink="/about" routerLinkActive="bg-blue-50 text-[#131e3d] font-semibold border-l-4 border-[#db3333]"
        class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">About</a>

      <a routerLink="/contact" routerLinkActive="bg-blue-50 text-[#131e3d] font-semibold border-l-4 border-[#db3333]"
        class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Contact</a>

      <!-- Mobile Book Now (Logged in customers) -->
      <a *ngIf="isLoggedIn && userRoleSlug !== 'service-provider'" routerLink="/request-quote"
        class="text-white bg-[#db3333] hover:bg-[#c22b2b] block px-4 py-3 rounded-lg text-base font-bold transition-all text-center mt-4">
        Request
      </a>

      <!-- Mobile Login (Not logged in) -->
      <a *ngIf="!isLoggedIn" routerLink="/customer-login"
        class="text-white bg-[#db3333] hover:bg-[#c22b2b] block px-4 py-3 rounded-lg text-base font-bold transition-all text-center mt-4">
        Login
      </a>

      <!-- Mobile Profile Options (Logged in) -->
      <div *ngIf="isLoggedIn" class="pt-4 mt-2 border-t border-gray-100">
        <div class="px-4 py-2 flex items-center space-x-3">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
              <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>
          <div class="text-sm font-medium text-gray-800">My Account</div>
        </div>
        <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/customer-profile"
          class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Profile</a>
        <a *ngIf="userRoleSlug === 'service-provider'" routerLink="/provider-profile"
          class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Profile</a>
        <a *ngIf="userRoleSlug === 'service-provider'" routerLink="/workshop-operations"
          class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Workshop Operations</a>
        <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/recent-activity"
          class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">Recent Activity</a>
        <a *ngIf="userRoleSlug !== 'service-provider'" routerLink="/my-requests"
          class="text-gray-600 hover:bg-gray-50 hover:text-[#db3333] block px-4 py-3 rounded-r-lg text-base font-medium transition-all">My Requests</a>
        <button (click)="logout()"
          class="text-red-600 hover:bg-red-50 block w-full text-left px-4 py-3 rounded-r-lg text-base font-medium transition-all">Logout</button>
      </div>
    </div>
  </div>
</nav>
